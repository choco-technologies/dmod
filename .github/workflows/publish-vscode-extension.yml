name: Publish VSCode Extension

on:
  push:
    tags:
      - 'vscode-dmm-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.1.0)'
        required: true

jobs:
  publish:
    name: Publish DMOD Manifest Extension
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install vsce
        run: npm install -g @vscode/vsce
      
      - name: Package extension
        working-directory: tools/lib/dmod_manifest/vscode-dmm
        run: vsce package
      
      - name: Publish to VS Code Marketplace
        working-directory: tools/lib/dmod_manifest/vscode-dmm
        run: vsce publish -p ${{ secrets.VSCE_PAT }}
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/vscode-dmm-v')
      
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmod-manifest-vsix
          path: tools/lib/dmod_manifest/vscode-dmm/*.vsix
