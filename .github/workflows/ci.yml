name: CI

on:
  push:
    branches: [ develop, master, feature/* ]
  pull_request:
    branches: [ develop, master, feature/* ]

jobs:
  cmake-build:
    name: 'CMAKE: Build for x86_64'
    runs-on: ubuntu-latest
    container:
      image: chocotechnologies/dmod:1.0.1
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Clean build directory
        run: rm -rf build
      
      - name: Create build directory
        run: mkdir -p build
      
      - name: Configure CMake for MODULE mode
        working-directory: build
        run: cmake .. -DDMOD_MODE=DMOD_MODULE -DDMOD_TOOLS_NAME=arch/x86_64
      
      - name: Build MODULE mode
        working-directory: build
        run: cmake --build .
      
      - name: Configure CMake for SYSTEM mode
        working-directory: build
        run: cmake .. -DDMOD_MODE=DMOD_SYSTEM -DDMOD_TOOLS_NAME=arch/x86_64
      
      - name: Build SYSTEM mode
        working-directory: build
        run: cmake --build .
      
      - name: Test loader with example_app.dmf
        working-directory: build
        run: ./examples/system/dmod_loader ./dmf/example_app.dmf
      
      - name: Test loader with MyApplication.dmf
        working-directory: build
        run: ./examples/system/dmod_loader ./dmf/MyApplication.dmf
      
      - name: Test DIF functionality
        working-directory: build
        run: |
          ./examples/system/dif_test/dif_test
          ./examples/system/dif_test/test_direct_access
      
      - name: Run coverage check
        working-directory: build
        run: cmake --build . --target coverage_check
        continue-on-error: true
      
      - name: Build compressed DMF
        working-directory: build
        run: |
          echo "Building compressed DMF"
          cmake .. -DDMOD_MODE=DMOD_MODULE -DDMOD_TOOLS_NAME=arch/x86_64
          cmake --build .
      
      - name: Test loader with compressed example_app.dmfc
        working-directory: build
        run: ./examples/system/dmod_loader ./dmfc/example_app.dmfc
      
      - name: Test loader with compressed DMF after removing dmf directory
        working-directory: build
        run: |
          rm -rf dmf
          ./examples/system/dmod_loader ./dmfc/example_app.dmfc

  make-build:
    name: 'MAKE: Build for x86_64'
    runs-on: ubuntu-latest
    container:
      image: chocotechnologies/dmod:1.0.1
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Clean build directory
        run: rm -rf build
      
      - name: Build MODULE mode with Make
        run: make DMOD_MODE=DMOD_MODULE
      
      - name: Build SYSTEM mode with Make
        run: make DMOD_MODE=DMOD_SYSTEM
      
      - name: Test loader with example_app.dmf
        run: chmod +x ./build/examples/system/dmod_loader/dmod_loader && ./build/examples/system/dmod_loader/dmod_loader build/dmf/example_app.dmf
      
      - name: Test loader with compressed example_app.dmfc
        run: ./build/examples/system/dmod_loader/dmod_loader build/dmfc/example_app.dmfc
      
      - name: Test loader with compressed DMF after removing dmf directory
        run: |
          rm -rf build/dmf
          ./build/examples/system/dmod_loader/dmod_loader build/dmfc/example_app.dmfc
      
      - name: DIF test 
        run: |
          chmod +x ./build/examples/system/dif_test/dif_test
          chmod +x ./build/examples/system/dif_test/test_direct_access
          ./build/examples/system/dif_test/dif_test
          ./build/examples/system/dif_test/test_direct_access
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dmod-build-artifacts
          path: |
            ./build/examples/system/dmod_loader/dmod_loader
            ./build/examples/system/dif_test/dif_test
            ./build/examples/system/dif_test/test_direct_access
            ./build/dmf/example_app.dmf
            ./build/dmf/dmodex.dmf